<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404: Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      border: 1px solid #ddd;
      padding: 1.5rem 2rem;
      border-radius: 6px;
      text-align: center;
      max-width: 480px;
    }
    .code {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .id {
      font-family: monospace;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
    }
    .custom-message {
      margin-top: 1rem;
      color: #666;
    }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid #6610f2;
      border-radius: 4px;
      text-decoration: none;
      color: #6610f2;
      font-size: 0.95rem;
    }
    .button:hover {
      background-color: #f2f0fd;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404: NOT_FOUND</div>
    <div>Code: <code>NOT_FOUND</code></div>
    <div class="id">ID: <code id="request-id">unknown</code></div>
    <div class="custom-message" id="custom-message"></div>
    <a class="button" href="https://your-docs-url">Read our documentation to learn more about this error.</a>
  </div>
  <script>
    // This will let you inject variables from Node.js:
    const requestId = "{{REQUEST_ID}}";
    const message = "{{MESSAGE}}";
    if (requestId) {
      document.getElementById("request-id").innerText = requestId;
    }
    if (message) {
      document.getElementById("custom-message").innerText = message;
    }
  </script>
</body>
</html>
