<svg width="0" height="0" style="position: absolute;">
  <defs>
    <!-- 8-bit Star -->
    <symbol id="pixel-star" viewBox="0 0 32 32">
      <rect x="14" y="2" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="22" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="22" width="4" height="4" fill="currentColor"/>
      <rect x="2" y="26" width="4" height="4" fill="currentColor"/>
      <rect x="26" y="26" width="4" height="4" fill="currentColor"/>
    </symbol>
    
    <!-- 8-bit Heart -->
    <symbol id="pixel-heart" viewBox="0 0 32 32">
      <rect x="6" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="6" width="4" height="4" fill="currentColor"/>
      <rect x="2" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="26" y="10" width="4" height="4" fill="currentColor"/>
      <rect x="2" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="26" y="14" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="18" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="22" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="22" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="22" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="26" width="4" height="4" fill="currentColor"/>
    </symbol>
    
    <!-- 8-bit Coin -->
    <symbol id="pixel-coin" viewBox="0 0 32 32">
      <rect x="10" y="4" width="12" height="4" fill="currentColor"/>
      <rect x="6" y="8" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="8" width="4" height="4" fill="currentColor"/>
      <rect x="4" y="12" width="4" height="8" fill="currentColor"/>
      <rect x="24" y="12" width="4" height="8" fill="currentColor"/>
      <rect x="6" y="20" width="4" height="4" fill="currentColor"/>
      <rect x="22" y="20" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="24" width="12" height="4" fill="currentColor"/>
      <rect x="12" y="12" width="2" height="8" fill="rgba(0,0,0,0.3)"/>
      <rect x="18" y="12" width="2" height="8" fill="rgba(0,0,0,0.3)"/>
    </symbol>
    
    <!-- 8-bit Pixel Block -->
    <symbol id="pixel-block" viewBox="0 0 32 32">
      <rect x="0" y="0" width="32" height="32" fill="currentColor"/>
      <rect x="0" y="0" width="28" height="28" fill="currentColor" opacity="0.8"/>
      <rect x="4" y="4" width="4" height="4" fill="rgba(255,255,255,0.3)"/>
    </symbol>
    
    <!-- 8-bit Sparkle -->
    <symbol id="pixel-sparkle" viewBox="0 0 24 24">
      <rect x="10" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="4" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="4" width="4" height="4" fill="currentColor"/>
      <rect x="2" y="8" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="8" width="4" height="4" fill="currentColor"/>
      <rect x="18" y="8" width="4" height="4" fill="currentColor"/>
      <rect x="6" y="12" width="4" height="4" fill="currentColor"/>
      <rect x="14" y="12" width="4" height="4" fill="currentColor"/>
      <rect x="10" y="16" width="4" height="4" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
