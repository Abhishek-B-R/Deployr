name: Deploy the backend to server

on: 
  push:
    branches: [main]
    paths:
      - 'docker-pull-and-builder/**'

jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Deploying everything to deployment
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v2
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Dockerhub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: abhibr/deployr-docker-pull-and-builder:${{ github.sha }}

      - name: Execute ssh commands using password
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 20.197.41.237
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/azureuser/deployr
            sudo docker-compose pull docker-pull-and-builder
            sudo docker-compose up -d docker-pull-and-builder
            sudo docker image prune -a -f